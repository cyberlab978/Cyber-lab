name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o CyberLabToolkit.zip

      - name: Remove missing app icon reference
        run: sed -i '/android:icon="@mipmap\/ic_launcher"/d' CyberLabToolkit/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: CyberLabToolkit
        run: gradle assembleDebug

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberLabToolkit-debug-apk
          path: CyberLabToolkit/app/build/outputs/apk/debug/app-debug.apk
